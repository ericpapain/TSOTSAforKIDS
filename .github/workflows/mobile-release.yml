# Application mobile : une nouvelle version Android est construite quand tu crées un tag mobile-vX.Y.Z
# (par exemple : git tag mobile-v1.0.0 && git push origin mobile-v1.0.0).
# Les applications ne se publient pas à chaque merge : chaque version passe par Google Play.
name: Mobile release

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  android:
    name: Build Android (EAS)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Construire l'application Android de production
        working-directory: apps/mobile
        run: eas build --platform android --profile production --non-interactive --no-wait
