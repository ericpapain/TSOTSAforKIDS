services:
  api:
    image: ghcr.io/ericpapain/tsotsa-kids-api:${IMAGE_TAG}
    container_name: tsotsa-api-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    volumes:
      - ${SECRETS_DIR:-/opt/tsotsa-kids/secrets}:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  scheduler:
    image: ghcr.io/ericpapain/tsotsa-kids-api:${IMAGE_TAG}
    container_name: tsotsa-scheduler-prod
    restart: unless-stopped
    command: ["python", "-m", "tsotsa_api.modules.notifications.runner"]
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    volumes:
      - ${SECRETS_DIR:-/opt/tsotsa-kids/secrets}:/run/secrets:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ghcr.io/ericpapain/tsotsa-kids-web:${IMAGE_TAG}
    container_name: tsotsa-web-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

